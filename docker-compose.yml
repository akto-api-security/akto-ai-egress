services:
  akto-egress-proxy:
    build:
      context: ./akto-egress-proxy
      dockerfile: Dockerfile
    image: akto-egress-proxy
    container_name: akto-egress-proxy
    command:
    - mitmdump
    - --listen-host
    - 0.0.0.0
    - --listen-port
    - "8087"
    - -s
    - /addons/akto_guardrails.py

    environment:
      AKTO_URL: ${AKTO_URL}
      APP_NAME: ${APP_NAME:-}
      # AKTO_TEXT_THRESHOLD: 600   # min accumulated chars in a streaming batch before sending to Akto for evaluation (default: 600)
      # AKTO_LOG_PAYLOADS: true   # log full request/response payloads for debugging (default: false)
    volumes:
      - ./mitmproxy-data:/home/mitmproxy/.mitmproxy
      - ./akto-egress-proxy:/addons:ro
    expose:
      - "8087"
    networks:
      - akto-egress-net

  # anthropic-agent:
