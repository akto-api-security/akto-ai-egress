services:
  akto-egress-proxy:
    image: public.ecr.aws/aktosecurity/akto-egress-proxy:latest
    container_name: akto-egress-proxy
    command:
    - mitmdump
    - --listen-host
    - 0.0.0.0
    - --listen-port
    - "8087"
    - --ignore-hosts
    - ^(?!.*((^|\.)anthropic\.com$$|(^|\.)openai\.com$$|(^|\.)chatgpt\.com$$|(^|\.)amazonaws\.com$$)).*$$
    - -s
    - /addons/akto_guardrails.py

    environment:
      AKTO_URL: ${AKTO_URL}
      APP_NAME: ${APP_NAME:-}
      AKTO_TOKEN: ${AKTO_TOKEN:-}
      AI_HOSTS: ${AI_HOSTS:-}
    volumes:
      - ./mitmproxy-data:/home/mitmproxy/.mitmproxy
    expose:
      - "8087"

  anthropic-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: anthropic-agent
    container_name: anthropic-agent
    depends_on:
      - akto-egress-proxy
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      HTTP_PROXY: http://akto-egress-proxy:8087
      HTTPS_PROXY: http://akto-egress-proxy:8087
      # Python clients ignore the OS store by default; point them at the bundle
      # update-ca-certificates builds (system CAs + mitmproxy CA).
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      AWS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - ./mitmproxy-data/mitmproxy-ca-cert.pem:/usr/local/share/ca-certificates/mitmproxy-ca-cert.crt:ro
