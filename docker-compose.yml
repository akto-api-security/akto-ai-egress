  #     ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  #     HTTP_PROXY: http://akto-egress-proxy:8087
  #     HTTPS_PROXY: http://akto-egress-proxy:8087
  #     SSL_CERT_FILE: /certs/mitmproxy-ca-cert.pem
  #     REQUESTS_CA_BUNDLE: /certs/mitmproxy-ca-cert.pem
  #   volumes:
  #     - ./mitmproxy-data/mitmproxy-ca-cert.pem:/certs/mitmproxy-ca-cert.pem:ro
  #   networks:
  #     - akto-egress-net

networks:
  akto-egress-net:
    external: true
